name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · unit, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Build web application
        run: npm run build
      - name: Install browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
        env:
          CI: 'true'
          E2E_PORT: '5178'
      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android · unit tests and debug compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Prepare verified native dictionary assets
        run: node scripts/prepare-android-assets.mjs
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Make wrapper executable
        run: chmod +x gradlew
        working-directory: android
      - name: Test and compile native app
        run: ./gradlew --no-daemon test assembleDebug
        working-directory: android
      - name: Preserve native test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

# Release signing and publication are deliberately separate from validation.
# This workflow has no signing credentials and does not publish a debug APK.
